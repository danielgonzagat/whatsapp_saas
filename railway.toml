[build]
builder = "RAILPACK"
buildCommand = "npm run railway:backend:build"

[deploy]
startCommand = "cd backend && NODE_ENV=production node prisma/ensure-migrations.js && NODE_ENV=production node -r ./dd-trace-init.cjs dist/src/bootstrap.js"
healthcheckPath = "/health/live"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
