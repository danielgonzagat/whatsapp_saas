name: Deploy Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - chore/purga-total-debt
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: git_ref is a controlled operator input that selects
    # which git ref to deploy to production; it is validated at checkout time and
    # never interpolated directly into a shell run command.
    inputs:
      git_ref:
        description: Git ref to deploy to production
        required: false
        default: main

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-production-pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy-production:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Production readiness gate
        run: npm run readiness:check

      - name: PULSE certification gate
        env:
          PULSE_CI_TIMEOUT_MS: '900000'
          PULSE_CI_HEARTBEAT_MS: '60000'
          PULSE_DISABLE_LOCAL_ENV: 'true'
        run: npm run pulse:ci

      - name: Railway runtime anti-regression gate
        env:
          RAILWAY_RUNTIME_REQUIRED: 'true'
          RAILWAY_RUNTIME_FAIL_ON_WARNINGS: 'true'
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN || secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_BACKEND_SERVICE_NAME: ${{ vars.RAILWAY_BACKEND_SERVICE }}
          RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          RAILWAY_WORKER_SERVICE_NAME: ${{ vars.RAILWAY_WORKER_SERVICE }}
          RAILWAY_SYSTEM_HEALTH_URL: ${{ vars.PRODUCTION_SYSTEM_HEALTH_URL }}
          RAILWAY_BACKEND_HEALTH_URL: ${{ vars.PRODUCTION_BACKEND_HEALTHCHECK_URL }}
          RAILWAY_FRONTEND_HEALTH_URL: ${{ vars.PRODUCTION_FRONTEND_HEALTHCHECK_URL }}
        run: npm run railway:runtime:check

      - name: Publish deployment summary
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- Ref: ${{ github.event.pull_request.head.sha }}"
            echo "- Mode: PR gate only; no production deploy executed."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production-live:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD || 'postgres' }}
          POSTGRES_DB: whatsapp_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.TEST_DB_PASSWORD || 'postgres' }}@localhost:5432/whatsapp_saas_test

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.inputs.git_ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            worker/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: |
          cd backend && npm run typecheck
          cd ../worker && npm run typecheck
          cd ../frontend && npm run typecheck

      - name: Prisma generate and migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: backend

      - name: Backend build
        run: npm run build
        working-directory: backend

      - name: Backend test
        run: npm test
        working-directory: backend

      - name: Worker generate Prisma client (from symlinked backend schema)
        run: npm run prisma:generate
        working-directory: worker

      # PR P4-2: worker tests now run in the production deploy pipeline.
      # Before this change the worker was built but never tested in
      # production deploy, which meant a worker test failure could
      # ship to production unblocked.
      - name: Worker test
        run: npm test
        working-directory: worker

      - name: Worker build
        run: npm run build
        working-directory: worker

      - name: Frontend build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          BACKEND_URL: http://localhost:3001
        run: npm run build
        working-directory: frontend

      - name: Frontend test
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          BACKEND_URL: http://localhost:3001
        run: npm test
        working-directory: frontend

      - name: Production readiness gate
        run: npm run readiness:check

      # PR P4-2: PULSE certification is now BLOCKING for production
      # deploys. Before this change continue-on-error was true, so
      # PULSE failures shipped to prod. The gate runs the same script
      # as before; the only change is that a non-zero exit fails the
      # workflow instead of being swallowed.
      - name: PULSE certification gate
        env:
          PULSE_CI_TIMEOUT_MS: '900000'
          PULSE_CI_HEARTBEAT_MS: '60000'
          PULSE_DISABLE_LOCAL_ENV: 'true'
        run: npm run pulse:ci

      - name: Install deployment CLIs
        if: github.event_name != 'pull_request'
        run: npm install -g @railway/cli vercel

      - name: Verify Railway deployment credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          test -n "${RAILWAY_TOKEN:-}" || { echo "::error::RAILWAY_TOKEN or RAILWAY_PROJECT_TOKEN is required"; exit 1; }
          test -n "${RAILWAY_PROJECT_ID:-}" || { echo "::error::RAILWAY_PROJECT_ID is required"; exit 1; }

      - name: Backup database before deploy
        if: github.event_name != 'pull_request'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [[ -n "${PRODUCTION_DATABASE_URL:-}" ]]; then
            pg_dump "${PRODUCTION_DATABASE_URL}" --format=custom --no-owner \
              -f /tmp/pre-deploy-backup.dump 2>/dev/null || echo "pg_dump skipped (no access or not configured)"
          else
            echo "PRODUCTION_DATABASE_URL not set, skipping backup"
          fi

      - name: Deploy backend to Railway production
        if: github.event_name != 'pull_request'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT }}
          RAILWAY_BACKEND_SERVICE: ${{ vars.RAILWAY_BACKEND_SERVICE }}
        run: |
          railway up backend \
            --path-as-root \
            --service "${RAILWAY_BACKEND_SERVICE:-backend}" \
            --environment "${RAILWAY_ENVIRONMENT:-production}" \
            --project "$RAILWAY_PROJECT_ID" \
            --ci

      - name: Deploy worker to Railway production
        if: github.event_name != 'pull_request'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT }}
          RAILWAY_WORKER_SERVICE: ${{ vars.RAILWAY_WORKER_SERVICE }}
        run: |
          railway up worker \
            --path-as-root \
            --service "${RAILWAY_WORKER_SERVICE:-worker}" \
            --environment "${RAILWAY_ENVIRONMENT:-production}" \
            --project "$RAILWAY_PROJECT_ID" \
            --ci

      - name: Deploy frontend to Vercel production
        if: github.event_name != 'pull_request'
        id: vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          deployment_url=$(vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tail -n 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Probe production health endpoints
        if: github.event_name != 'pull_request'
        env:
          BACKEND_HEALTH_URL: ${{ vars.PRODUCTION_BACKEND_HEALTHCHECK_URL }}
          WORKER_HEALTH_URL: ${{ vars.PRODUCTION_WORKER_HEALTHCHECK_URL }}
          FRONTEND_HEALTH_URL: ${{ vars.PRODUCTION_FRONTEND_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail

          if [[ -n "${BACKEND_HEALTH_URL:-}" ]]; then
            curl -fsS "$BACKEND_HEALTH_URL" >/dev/null
            echo "backend health ok"
          fi

          if [[ -n "${WORKER_HEALTH_URL:-}" ]]; then
            curl -fsS "$WORKER_HEALTH_URL" >/dev/null
            echo "worker health ok"
          fi

          if [[ -n "${FRONTEND_HEALTH_URL:-}" ]]; then
            curl -fsS "$FRONTEND_HEALTH_URL" >/dev/null
            echo "frontend health ok"
          fi

      - name: Railway runtime anti-regression gate
        env:
          RAILWAY_RUNTIME_REQUIRED: 'true'
          RAILWAY_RUNTIME_FAIL_ON_WARNINGS: 'true'
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN || secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_BACKEND_SERVICE_NAME: ${{ vars.RAILWAY_BACKEND_SERVICE }}
          RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          RAILWAY_WORKER_SERVICE_NAME: ${{ vars.RAILWAY_WORKER_SERVICE }}
          RAILWAY_SYSTEM_HEALTH_URL: ${{ vars.PRODUCTION_SYSTEM_HEALTH_URL }}
          RAILWAY_BACKEND_HEALTH_URL: ${{ vars.PRODUCTION_BACKEND_HEALTHCHECK_URL }}
          RAILWAY_FRONTEND_HEALTH_URL: ${{ vars.PRODUCTION_FRONTEND_HEALTHCHECK_URL }}
        run: npm run railway:runtime:check

      - name: Rollback on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT }}
        run: |
          echo "Deploy failed — rollback may be required."
          echo "To revert to previous deploy, re-run this workflow with the last known good git ref."
          echo "Database backup (if created) is at /tmp/pre-deploy-backup.dump"

      - name: Publish deployment summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_GIT_REF: ${{ github.event.inputs.git_ref }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            GIT_REF="$PULL_REQUEST_HEAD_SHA"
          else
            GIT_REF="${INPUT_GIT_REF:-main}"
          fi
          {
            echo "## Production deploy"
            echo ""
            echo "- Ref: \`${GIT_REF}\`"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              echo "- Mode: PR gate only; no production deploy executed."
            else
              echo "- Frontend deployment: ${DEPLOYMENT_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
