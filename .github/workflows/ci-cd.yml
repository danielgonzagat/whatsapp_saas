name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, chore/purga-total-debt]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Architecture guardrails
        run: npm run architecture:check

  quality:
    needs: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: whatsapp_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/whatsapp_saas_test
      JWT_SECRET: test_secret
      REDIS_URL: redis://localhost:6379
      OPENAI_API_KEY: e2e-dummy-key
      NEXT_PUBLIC_API_URL: http://localhost:3001
      BACKEND_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: test_secret
      METRICS_TOKEN: test-metrics-token
      DIAG_TOKEN: test-diag-token
      ASAAS_WEBHOOK_TOKEN: test-asaas-token
      OPS_WEBHOOK_URL: https://example.com/ops-webhook
      DLQ_WEBHOOK_URL: https://example.com/dlq-webhook

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            worker/package-lock.json
            e2e/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Production readiness gate
        run: npm run readiness:check

      - name: Guard forbidden prisma db push usage
        run: npm run guard:db-push

      - name: Formatting check
        run: npm run format:check

      - name: Comprehensive gate suite
        run: npm run check:all

      - name: ESLint seatbelt gate
        run: npm run seatbelt:check

      - name: Knip dead-code baseline gate
        run: npm run quality:dead-code

      - name: Madge cycle baseline gate
        run: npm run quality:graph

      - name: Contract schema sync (frontend ↔ backend)
        run: node scripts/ops/check-contract-sync.mjs

      - name: Prisma schema single source (worker symlinks backend)
        run: node scripts/ops/check-prisma-schema-single-source.mjs

      - name: Redis URL resolver sync (backend ↔ worker)
        run: node scripts/ops/check-redis-resolver-sync.mjs

      - name: Tenant isolation static scan (invariant I4)
        run: node scripts/ops/check-tenant-filter.mjs --summary

      - name: Tenant isolation redis key scan (invariant I4)
        run: node scripts/ops/check-tenant-keys.mjs --summary

      - name: Shared constants sync (sales templates etc.)
        run: node scripts/ops/check-constants-sync.mjs

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prisma validate and generate
        run: |
          npm run prisma:validate
          npm run prisma:generate

      - name: Backend test and build
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run test:cov -- --runInBand
          npm run build
        working-directory: backend

      - name: Worker test and build
        run: |
          npm run prisma:generate
          npm run test:coverage
          npm run build
        working-directory: worker

      - name: Frontend test and build
        run: |
          npm run test:coverage
          npm run build
        working-directory: frontend

      - name: Normalize LCOV paths for monorepo uploads
        run: npm run coverage:normalize

      - name: Validate coverage summaries
        run: |
          missing=0
          for dir in backend frontend worker; do
            if [ -f "$dir/coverage/coverage-summary.json" ]; then
              echo "  ✓ $dir coverage-summary.json found"
            else
              echo "  ✗ $dir coverage-summary.json MISSING"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "ERROR: coverage-summary.json missing in one or more packages"
            exit 1
          fi
          echo ""
          echo "All coverage-summary.json files present"

      # Codecov Coverage Analytics — one upload per workspace with a flag so
      # the dashboard separates backend/frontend/worker rollups and component
      # targets in codecov.yml resolve correctly.
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: true
          verbose: true

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
          verbose: true

      - name: Upload worker coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: worker/coverage/lcov.info
          flags: worker
          fail_ci_if_error: true
          verbose: true

      # Codecov Test Analytics — JUnit XML upload per workspace with the same
      # flag namespace used by coverage above. `if: !cancelled()` ensures test
      # runtime data still uploads on test failure, which is the whole point
      # of Test Analytics (flaky test detection, runtime trends).
      - name: Upload backend test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/test-results/backend-junit.xml
          flags: backend
          report_type: test_results

      - name: Upload frontend test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/test-results/frontend-junit.xml
          flags: frontend
          report_type: test_results

      - name: Upload worker test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: worker/test-results/worker-junit.xml
          flags: worker
          report_type: test_results

      - name: Upload coverage reports to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: backend/coverage/lcov.info,frontend/coverage/lcov.info,worker/coverage/lcov.info

      - name: PULSE certification gate
        env:
          PULSE_CI_TIMEOUT_MS: '900000'
          PULSE_CI_HEARTBEAT_MS: '60000'
          PULSE_DISABLE_LOCAL_ENV: 'true'
        run: npm run pulse:ci

      - name: Railway runtime anti-regression gate
        env:
          RAILWAY_RUNTIME_REQUIRED: 'true'
          RAILWAY_RUNTIME_FAIL_ON_WARNINGS: 'true'
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN || secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}
          RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
          RAILWAY_BACKEND_SERVICE_NAME: ${{ vars.RAILWAY_BACKEND_SERVICE }}
          RAILWAY_WORKER_SERVICE_ID: ${{ vars.RAILWAY_WORKER_SERVICE_ID }}
          RAILWAY_WORKER_SERVICE_NAME: ${{ vars.RAILWAY_WORKER_SERVICE }}
          RAILWAY_SYSTEM_HEALTH_URL: ${{ vars.PRODUCTION_SYSTEM_HEALTH_URL }}
          RAILWAY_BACKEND_HEALTH_URL: ${{ vars.PRODUCTION_BACKEND_HEALTHCHECK_URL }}
          RAILWAY_FRONTEND_HEALTH_URL: ${{ vars.PRODUCTION_FRONTEND_HEALTHCHECK_URL }}
        run: npm run railway:runtime:check

      - name: Quality ratchet gate
        run: npm run ratchet:check

      - name: Upload PULSE and readiness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-quality-artifacts
          path: |
            ratchet.json
            PULSE_*.json
            PULSE_*.md
            PULSE_*
            AUDIT_FEATURE_MATRIX.md
            KLOEL_PRODUCT_MAP.md
            PULSE_REPORT.md
            PULSE_CERTIFICATE.json
            backend/coverage/**
            frontend/coverage/**
            worker/coverage/**
            backend/test-results/**
            frontend/test-results/**
            worker/test-results/**
            .eslint-seatbelt.tsv
          if-no-files-found: ignore

  pulse-deep:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PULSE_BACKEND_URL: http://localhost:3099
      JWT_SECRET: pulse-deep-ci-test-secret
      AUTH_OPTIONAL: 'true'
      OPENAI_API_KEY: e2e-dummy-key

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Build backend
        run: |
          npx prisma generate
          npm run build
        working-directory: backend

      - name: Run PULSE deep triple-cycle (docker compose + 3x certify + assertions)
        env:
          PULSE_CI_TIMEOUT_MS: '1800000'
        run: node scripts/ops/run-pulse-deep-ci.mjs --triple-cycle

      - name: Print assertion report
        if: always()
        run: |
          if [ -f PULSE_CERTIFICATE_ASSERTIONS.json ]; then
            echo "=== Triple-Cycle Assertion Report ==="
            cat PULSE_CERTIFICATE_ASSERTIONS.json | node -e "
              const d = JSON.parse(require('fs').readFileSync(0,'utf-8'));
              console.log('Overall:', d.overall);
              console.log('Cycles:', d.cycles);
              console.log('');
              for (const [key, a] of Object.entries(d.assertions)) {
                console.log(key + ':', a.passed ? 'PASS' : 'FAIL');
                if (a.detail) console.log('  ' + a.detail);
              }
              console.log('');
              for (const cd of (d.cycles_detail || [])) {
                console.log('Cycle ' + cd.cycle + ': ' +
                  'probes=' + cd.runtime_probes_executed + ' ' +
                  'gates=' + cd.gates_passed + '/' + cd.gates_total + ' PASS ' +
                  (cd.all_gates_pass ? '' : 'FAILING: ' + (cd.failing_gates || []).join(', ')));
              }
            "
          else
            echo 'No assertion report found.'
          fi

      - name: Print certificate gate summary for each cycle
        if: always()
        run: |
          for i in 1 2 3; do
            cert="PULSE_CERTIFICATE_CYCLE_${i}.json"
            if [ -f "$cert" ]; then
              echo "=== $cert ==="
              cat "$cert" | node -e "
                const d = JSON.parse(require('fs').readFileSync(0,'utf-8'));
                console.log('status:', d.status);
                console.log('score:', d.score);
                console.log('environment:', d.environment);
                const failing = Object.entries(d.gates||{}).filter(([,g])=>g.status!=='pass').map(([n])=>n);
                if (failing.length) console.log('failing_gates:', failing.join(', '));
                else console.log('all gates PASS');
              "
            else
              echo "$cert: not found"
            fi
          done

      - name: Upload PULSE deep triple-cycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-deep-artifacts
          path: |
            PULSE_*.json
            PULSE_*.md
            PULSE_*
            PULSE_REPORT.md
            PULSE_CERTIFICATE.json
            PULSE_CERTIFICATE_CYCLE_*.json
            PULSE_CERTIFICATE_ASSERTIONS.json
            .pulse/current/PULSE_RUNTIME_EVIDENCE.json
            .pulse/current/PULSE_RUNTIME_PROBES.json
            .pulse/current/PULSE_CERTIFICATE_CYCLE_*.json
          if-no-files-found: ignore

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: whatsapp_saas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/whatsapp_saas_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret
      OPENAI_API_KEY: e2e-dummy-key
      NEXT_PUBLIC_API_URL: http://localhost:3001
      BACKEND_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: test_secret
      ASAAS_WEBHOOK_TOKEN: test-asaas-token

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            worker/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e

      - name: Build backend, worker and frontend
        run: |
          cd backend
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          cd ../worker
          npm run build
          cd ../frontend
          npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Start services
        run: |
          set -euo pipefail

          cd backend
          node dist/src/bootstrap.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          cd - >/dev/null

          cd worker
          node dist/bootstrap.js > /tmp/worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          cd - >/dev/null

          cd frontend
          PORT=3000 npm run start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
          cd - >/dev/null

          echo "Aguardando backend..."
          for i in {1..60}; do
            if curl -sf http://localhost:3001/health >/dev/null; then
              echo "✓ backend"
              break
            fi
            sleep 2
            if [[ "$i" == "60" ]]; then
              echo "Backend não ficou pronto"
              tail -n 200 /tmp/backend.log || true
              exit 1
            fi
          done

          echo "Aguardando worker..."
          for i in {1..60}; do
            if curl -sf http://localhost:3003/health >/dev/null; then
              echo "✓ worker"
              break
            fi
            sleep 2
            if [[ "$i" == "60" ]]; then
              echo "Worker não ficou pronto"
              tail -n 200 /tmp/worker.log || true
              exit 1
            fi
          done

          echo "Aguardando frontend..."
          for i in {1..60}; do
            if curl -sf http://localhost:3000/login >/dev/null; then
              echo "✓ frontend"
              break
            fi
            sleep 2
            if [[ "$i" == "60" ]]; then
              echo "Frontend não ficou pronto"
              tail -n 200 /tmp/frontend.log || true
              exit 1
            fi
          done

      - name: Run Playwright E2E
        env:
          PW_TEST_HTML_REPORT_OPEN: never
        run: npm test
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Stop services and print logs
        if: always()
        run: |
          for f in /tmp/frontend.pid /tmp/worker.pid /tmp/backend.pid; do
            if [ -f "$f" ]; then
              pid=$(cat "$f")
              kill "$pid" 2>/dev/null || true
            fi
          done

          echo "--- backend.log ---"
          tail -n 200 /tmp/backend.log || true
          echo "--- worker.log ---"
          tail -n 200 /tmp/worker.log || true
          echo "--- frontend.log ---"
          tail -n 200 /tmp/frontend.log || true
