[build]
# PR314 runtime refresh marker: force Railway to rebuild after CI gate fixes.
builder = "RAILPACK"
buildCommand = "npm ci --include=dev && npm run prisma:generate && npm run build"
watchPatterns = ["**"]

[deploy]
preDeployCommand = "node prisma/ensure-migrations.js"
startCommand = "node -r ./dd-trace-init.cjs dist/src/bootstrap.js"
healthcheckPath = "/health/live"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
