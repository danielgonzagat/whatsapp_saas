[build]
# Production deploys read railway.json so Dockerfile inheritance can be nulled.
# PR314 runtime refresh marker: force Railway to rebuild after CI gate fixes.
builder = "RAILPACK"
buildCommand = "npm ci --include=dev && npm run prisma:generate && npm run build"
watchPatterns = ["**"]

[deploy]
startCommand = "npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
