# CodeRabbit — KLOEL bigtech-level configuration
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# Updated 2026-05-06. Contract: read CLAUDE.md, AGENTS.md, docs/adr/**, docs/plans/** as source of truth.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
# tone_instructions schema cap is 250 chars; deep guidance lives in path_instructions below.
tone_instructions: >-
  KLOEL monorepo handling real money (Stripe), WhatsApp, KYC. Be assertive,
  terse, technical. Cite file:line. Concrete diff suggestions over abstract
  advice. No poems or motivational copy. Never suggest weakening lint, Codacy,
  or PULSE.
early_access: true
enable_free_tier: false

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'
  high_level_summary_in_walkthrough: true
  auto_title_placeholder: '@coderabbitai'
  auto_title_instructions: >-
    Conventional Commits (feat/fix/refactor/test/docs/chore + scope). Title in
    English even if PR body is Portuguese. Keep under 70 chars.
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  poem: false
  labeling_instructions: []
  path_filters:
    - '!**/*.lock'
    - '!**/*-lock.json'
    - '!**/pnpm-lock.yaml'
    - '!**/yarn.lock'
    - '!**/package-lock.json'
    - '!**/dist/**'
    - '!**/build/**'
    - '!**/.next/**'
    - '!**/node_modules/**'
    - '!**/coverage/**'
    - '!**/playwright-report/**'
    - '!**/test-results/**'
    - '!**/PULSE_*.json'
    - '!**/PULSE_*.md'
    - '!**/CODACY_*.json'
    - '!**/*.min.js'
    - '!**/*.min.css'
    - '!**/*.snap'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.svg'
  path_instructions:
    - path: 'CLAUDE.md'
      instructions: >-
        Protected file — never suggest edits. Read it as binding contract for
        the whole repo.
    - path: 'AGENTS.md'
      instructions: >-
        Protected file — never suggest edits. Read it as binding contract.
    - path: 'docs/adr/**'
      instructions: >-
        Architecture Decision Records. Cross-check every PR change against the
        relevant ADR. Flag any deviation.
    - path: 'docs/plans/**'
      instructions: >-
        Authoritative implementation plans (Stripe migration, PULSE roadmap).
        Flag any code change that contradicts the plan.
    - path: 'backend/src/**/*.ts'
      instructions: >-
        NestJS service. Require: class-validator DTO, AuthGuard where needed,
        workspaceId scoping on every query, prisma typed (no prismaAny in new
        code), `prisma.$transaction` for multi-table writes, idempotency on
        webhooks and external calls, structured logger context with
        workspaceId/userId/externalId, no console.log. Money is bigint cents —
        flag any `number`/float used for money.
    - path: 'backend/src/**/*.spec.ts'
      instructions: >-
        Unit tests must hit real Prisma test client or explicit prisma test doubles — never
        leave a `it<dot>skip`. Coverage targets: SplitEngine/LedgerEngine/FraudEngine
        ≥95%, security guards ≥90%, controllers ≥80%.
    - path: 'backend/prisma/schema.prisma'
      instructions: >-
        Schema changes require: matching migration, workspace scoping, indexes
        on lookup fields, unique constraints on natural keys. Money columns
        must be `BigInt` (cents). Flag any `Float`/`Decimal` for money.
    - path: 'backend/prisma/migrations/**'
      instructions: >-
        Migrations must be additive and reversible. Flag any DROP COLUMN, DROP
        TABLE, RENAME on production-bound models without explicit safety plan.
        Never suggest `prisma db push`.
    - path: 'backend/src/payments/**'
      instructions: >-
        Stripe Connect platform model (ADR 0003). Money in bigint cents.
        Webhooks must verify `stripe-signature` against STRIPE_WEBHOOK_SECRET
        and be idempotent (check WebhookEvent before processing). LedgerEntry is
        append-only — flag any UPDATE/DELETE on ledger rows. Test mode keys in
        dev; live keys only via Railway secret.
    - path: 'backend/src/webhooks/**'
      instructions: >-
        Every webhook controller must: verify provider signature, persist a
        WebhookEvent row keyed by `(provider, externalId)`, short-circuit on
        duplicate, return 2xx fast, dispatch heavy work to BullMQ. Flag missing
        signature verification or missing idempotency.
    - path: 'backend/src/auth/**'
      instructions: >-
        Auth surface. Require: bcrypt for passwords, refresh-token rotation,
        rate limit on login (5/min per IP), no PII in logs, JWT with
        expiration, Google OAuth state validated. Flag plaintext secrets,
        missing rate limit, or weak token TTL.
    - path: 'backend/src/whatsapp/**'
      instructions: >-
        WAHA + Meta Cloud API providers per ADR 0001. Sessions per workspace —
        never global. Idempotent inbound message handling keyed by external
        messageId. Rate limit + backoff on outbound. No payload secrets in
        logs.
    - path: 'frontend/src/app/**/page.tsx'
      instructions: >-
        Preserve the visual shell. Forbidden in product surfaces: Math.random,
        setInterval incrementing fabricated/synthetic metrics, hardcoded arrays as data,
        localStorage as DB, dead handlers (console.log as onClick body). Use
        design tokens from `@/lib/design-tokens`. Required UI states: loading,
        empty, error, success.
    - path: 'frontend/src/lib/api/**'
      instructions: >-
        Use `apiFetch` and `swrFetcher`. No fetch() with hardcoded URLs.
        Typed responses. Surface backend errors honestly — never swallow.
    - path: 'worker/**/*.ts'
      instructions: >-
        BullMQ processors. Require: explicit job schema, idempotent handler,
        bounded retries with backoff, dead-letter on max attempts, structured
        logging, graceful shutdown. Long-running jobs must checkpoint progress.
    - path: '**/*.test.ts'
      instructions: >-
        No skip-marker or only-marker in committed code. Real assertions — flag tests that
        only check truthiness without behavioral expectations.
    - path: 'scripts/pulse/no-hardcoded-reality-audit.ts'
      instructions: >-
        PROTECTED PULSE auditor. Never suggest edits to weaken/bypass/rename or
        reduce its coverage. CLAUDE.md forbids it.
    - path: 'scripts/pulse/**'
      instructions: >-
        PULSE detectors. Suggestions allowed only if they make detection more
        accurate or expand coverage — never to suppress findings.
    - path: '.github/workflows/**'
      instructions: >-
        CI is a guardrail. Flag any change that disables required checks
        (CI, CodeQL, Deploy *, Nightly Ops Audit), removes jobs, or weakens
        matrix coverage.
    - path: '**/Dockerfile*'
      instructions: >-
        Pin base images by digest where possible, run as non-root, no secrets
        baked in, multi-stage builds, healthcheck declared.
  abort_on_close: true
  disable_cache: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - WIP
      - DO NOT MERGE
      - '[skip review]'
    labels: []
    drafts: false
    base_branches:
      - main
      - 'release/.*'
      - 'staging'
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: warning
    title:
      mode: warning
      requirements: >-
        Conventional Commits format with type(scope): description. Scope must
        match an actual area (auth, checkout, wallet, whatsapp, autopilot,
        flows, crm, dashboard, prisma, pulse, codacy, ci, docs, etc.).
    description:
      mode: warning
    issue_assessment:
      mode: warning
    custom_checks: []
  tools:
    ast-grep:
      essential_rules: true
      rule_dirs: []
      util_dirs: []
      packages: []
    actionlint:
      enabled: true
    biome:
      enabled: true
    brakeman:
      enabled: false
    buf:
      enabled: true
    checkmake:
      enabled: true
    checkov:
      enabled: true
    circleci:
      enabled: false
    clippy:
      enabled: false
    cppcheck:
      enabled: false
    detekt:
      enabled: false
    dotenvLint:
      enabled: true
    eslint:
      enabled: true
    flake8:
      enabled: true
    gitleaks:
      enabled: true
    golangci-lint:
      enabled: false
    hadolint:
      enabled: true
    htmlhint:
      enabled: true
    languagetool:
      enabled: true
      enabled_rules: []
      disabled_rules:
        - EN_UNPAIRED_BRACKETS
        - EN_QUOTES
      enabled_categories: []
      disabled_categories:
        - TYPOS
        - CASING
        - TYPOGRAPHY
      enabled_only: false
      level: default
    markdownlint:
      enabled: true
    oxc:
      enabled: true
    phpcs:
      enabled: false
    phpmd:
      enabled: false
    phpstan:
      enabled: false
    pmd:
      enabled: false
    prismaLint:
      enabled: true
    pylint:
      enabled: true
    regal:
      enabled: false
    rubocop:
      enabled: false
    ruff:
      enabled: true
    semgrep:
      enabled: true
    shellcheck:
      enabled: true
    shopifyThemeCheck:
      enabled: false
    sqlfluff:
      enabled: true
    swiftlint:
      enabled: false
    yamllint:
      enabled: true

chat:
  art: false
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: auto
    project_keys: []
  linear:
    usage: auto
    team_keys: []
  pull_requests:
    scope: auto
  mcp:
    usage: auto
    disabled_servers: []
  code_guidelines:
    enabled: true
    filePatterns:
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - 'CODEX.md'
      - 'docs/adr/**'
      - 'docs/plans/**'
      - 'docs/design/**'
      - 'docs/ai/**'
      - 'docs/GITHUB_REPOSITORY_SETTINGS.md'

code_generation:
  docstrings:
    language: en-US
    path_instructions:
      - path: 'backend/src/**/*.ts'
        instructions: >-
          TSDoc style. Document public API methods. Include @throws for
          domain errors and @example for non-trivial signatures.
      - path: 'frontend/src/**/*.{ts,tsx}'
        instructions: >-
          TSDoc style. Document exported hooks/components. Include props and
          accessibility notes when relevant.
  unit_tests:
    path_instructions:
      - path: 'backend/src/**/*.service.ts'
        instructions: >-
          Vitest/Jest. Cover happy path, validation failure, authorization
          failure, workspace isolation breach attempt, idempotent replay where
          applicable, and external-provider error.
      - path: 'frontend/src/**/*.{ts,tsx}'
        instructions: >-
          Vitest + Testing Library. Cover render, loading, empty, error states,
          and primary user interaction. Use `screen.getByRole` / accessible
          queries.
